services:
  anchorr:
    image: nairdah/anchorr:latest
    container_name: anchorr
    restart: unless-stopped
    ports:
      - "8282:8282" # change the first number to use another port on the host
    volumes:
      # Configuration and state. Change ./anchorr-data to keep them elsewhere.
      - ./anchorr-data:/usr/src/app/config
    # environment:
    #   - TRUST_PROXY=true   # behind a reverse proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8282/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
